<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Day — English</title>
<meta name="description" content="Тренажёр английского по лекциям и курсу: экономика, ИИ, midterm.">
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1c2333;--muted:#667085;--line:#e3e7ef;--accent:#2563eb;--accent-ink:#fff;--ok:#15803d;--okbg:#e6f6ec;--bad:#b42318;--badbg:#fdeceb}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1321;--card:#161d2f;--ink:#e7ebf4;--muted:#98a2b3;--line:#2a3347;--accent:#6ea8ff;--accent-ink:#0b1220;--ok:#4ade80;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1a1a}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:22px;margin:0}
.stats{display:flex;gap:8px;font-weight:600}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.pack-title{font-weight:700;font-size:18px;margin:0 0 4px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 14px;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.small{min-height:36px;padding:6px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
button.opt{display:block;width:100%;text-align:left;margin-bottom:8px}
button.opt.right{background:var(--okbg);border-color:var(--ok)}
button.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.prompt{font-size:14px;color:var(--muted);margin-bottom:6px}
.sentence{font-size:20px;line-height:1.5;margin:6px 0 14px}
.gap{color:var(--accent);font-weight:700}
.fb{min-height:24px;margin-top:10px;font-weight:600}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.tip{font-weight:400;color:var(--muted);font-size:15px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{min-height:40px;padding:8px 12px}
.answer-area{min-height:52px;border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.hidden{display:none !important}
.screen{display:none}
.screen.on{display:block}
ul.vocab{padding-left:18px;margin:8px 0}
ul.vocab li{margin-bottom:8px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;font-size:13px}
.err{color:var(--bad);font-weight:600;margin-top:8px;min-height:20px}
@media (max-width:420px){h1{font-size:19px}.sentence{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Market Day</h1>
  <div class="stats"><span class="pill" id="capitalPill">$ 0</span><span class="pill" id="streakPill" hidden></span></div>
</header>

<section id="scrHome" class="screen on">
  <div class="card">
    <p class="muted" style="margin:0">Каждый день — один пакет заданий. Пакет — новые задания по теме лекции или курса. Пакеты и прогресс хранятся только в этом браузере.</p>
  </div>
  <div id="packList"></div>
  <div class="card">
    <button class="primary" id="btnAdd" style="width:100%">Добавить пакет из лекции</button>
    <div id="addBox" class="hidden" style="margin-top:12px">
      <p class="muted" style="margin-top:0">Вставьте JSON-пакет. Формат ниже.</p>
      <textarea id="packText" spellcheck="false" placeholder='{"title": "...", "items": [...]}'></textarea>
      <div class="row" style="margin-top:8px">
        <button id="btnExample" class="small">Вставить пример</button>
        <button id="btnSave" class="primary">Проверить и сохранить</button>
      </div>
      <div id="addErr" class="err" role="alert"></div>
      <p class="muted">Формат: type — gap, meaning, build или listen.</p>
      <pre id="schema"></pre>
    </div>
  </div>
</section>

<section id="scrPlay" class="screen">
  <div class="row" style="justify-content:space-between;margin-bottom:4px">
    <button id="btnBack" class="small">← Дни</button>
    <span class="muted" id="counter"></span>
  </div>
  <div class="bar"><div id="bar"></div></div>
  <div class="card">
    <div class="prompt" id="prompt"></div>
    <div id="task"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button id="btnNext" class="primary hidden" style="width:100%;margin-top:8px">Дальше</button>
  </div>
</section>

<section id="scrDone" class="screen">
  <div class="card" id="result"></div>
  <div class="row">
    <button class="primary" id="btnAgain">Ещё раз</button>
    <button id="btnHome">К дням</button>
  </div>
</section>
</div>

<script>
const $ = id => document.getElementById(id);

// Создаёт элемент. Строки вставляются как текст, а не как HTML.
function h(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') n.className = attrs[k];
    else if(k === 'on') for(const ev in attrs.on) n.addEventListener(ev, attrs.on[ev]);
    else if(k in n && typeof attrs[k] !== 'string') n[k] = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => { if(c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return n;
}

const store = {
  get(key, fb){ try{ const v = localStorage.getItem(key); return v == null ? fb : JSON.parse(v); }catch(e){ return fb; } },
  set(key, v){ try{ localStorage.setItem(key, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

// Данные из localStorage могут быть повреждены: проверяем форму при чтении.
function sanitizePacks(v){
  return Array.isArray(v) ? v.filter(p => p && typeof p.id === 'string' && typeof p.title === 'string' && Array.isArray(p.items)) : [];
}
function sanitizeProgress(v){
  const out = {};
  if(v && typeof v === 'object' && !Array.isArray(v)){
    for(const id of Object.keys(v)){
      const e = v[id];
      if(!e || typeof e !== 'object') continue;
      out[id] = {
        missed: Array.isArray(e.missed) ? e.missed.filter(Number.isInteger) : [],
        plays: Number.isFinite(e.plays) ? e.plays : 0,
        bestFirstTry: Number.isFinite(e.bestFirstTry) ? e.bestFirstTry : 0
      };
    }
  }
  return out;
}
function readCapital(){
  const c = store.get('md_capital', 0);
  return Number.isFinite(c) ? c : 0;
}

let userPacks = sanitizePacks(store.get('md_packs', []));
let progress = sanitizeProgress(store.get('md_progress', {}));
let capital = readCapital();
const openVocab = new Set();
const BUILTIN_IDS = ['midterm', 'demo'];
let S = null; // текущая сессия

// Midterm: недели 1 и 3. Все задания написаны заново по темам курса, исходные задания курса не используются.

    {word: 'pleased', ru: 'довольный, рад', example: 'She was pleased to get the job offer.'},
    {word: 'delighted', ru: 'в восторге, очень рад', example: 'We were delighted by the surprise party.'},
    {word: 'cheerful', ru: 'весёлый, жизнерадостный', example: 'The cheerful waiter greeted us with a smile.'},

    {type: 'build', sentence: 'We were walking home when the rain started.', ru: 'Мы шли домой, когда начался дождь.', tip: 'Длинное действие в процессе — Past Continuous; короткое, которое его прервало, — Past Simple.'},

    {type: 'meaning', word: 'drizzle', answer: 'морось, моросить', options: ['морось, моросить', 'ураган', 'туман', 'засуха']},

const SCHEMA = `{
  "title": "Лекция 3: инфляция и ставки",

function allPacks(){ return [MIDTERM, DEMO, ...userPacks]; }

function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Сравнение ответа: регистр, пунктуация и типографские апострофы не важны.
function norm(s){
  return String(s).normalize('NFC')
    .toLowerCase()
    .replace(/[‘’ʼ`´]/g, "'")
    .replace(/(^|\s)'|'(?=\s|$)/g, ' ')
    .replace(/[^\p{L}\p{N}\p{M}' ]+/gu, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

function validatePack(obj){
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('Пакет должен быть JSON-объектом.');
  if(typeof obj.title !== 'string' || !obj.title.trim()) throw new Error('Нужно поле "title" (строка).');
  if(!Array.isArray(obj.items) || !obj.items.length) throw new Error('Нужен непустой массив "items".');
  obj.items.forEach((it, i) => {
    const where = `items[${i}]`;
    const need = (cond, msg) => { if(!cond) throw new Error(`${where}: ${msg}`); };
    need(it && typeof it === 'object', 'должен быть объектом');
    if(it.type === 'gap'){
      need(typeof it.sentence === 'string' && it.sentence.split('___').length === 2, 'в "sentence" нужен ровно один пропуск ___');
      need(typeof it.answer === 'string' && it.answer.trim(), 'нужен "answer"');
      need(Array.isArray(it.options) && it.options.includes(it.answer), '"options" должен содержать "answer"');
    } else if(it.type === 'meaning'){
      need(typeof it.word === 'string' && it.word.trim(), 'нужен "word"');
      need(typeof it.answer === 'string' && it.answer.trim(), 'нужен "answer" (перевод)');
      need(Array.isArray(it.options) && it.options.includes(it.answer), '"options" должен содержать "answer"');
    } else if(it.type === 'build' || it.type === 'listen'){
      need(typeof it.sentence === 'string' && norm(it.sentence) !== '', 'нужно "sentence" с буквами');
    } else {
      need(false, `неизвестный type "${it.type}" (gap, meaning, build, listen)`);
    }
  });
  return obj;
}

function show(id){
  for(const s of ['scrHome', 'scrPlay', 'scrDone']) $(s).classList.toggle('on', s === id);
  window.scrollTo(0, 0);
  if(id === 'scrHome') renderHome();
  updateStats();
}

function updateStats(){
  $('capitalPill').textContent = '$ ' + (capital + (S ? S.earned : 0));
  const sp = $('streakPill');
  sp.hidden = !(S && S.streak > 1 && $('scrPlay').classList.contains('on'));
  sp.textContent = 'серия ' + (S ? S.streak : 0);
}

// ---------- Дни (пакеты) ----------

function renderHome(){
  const list = $('packList');
  list.replaceChildren();
  allPacks().forEach(p => {
    const prog = progress[p.id] || {missed: [], plays: 0};
    const card = h('div', {class: 'card'},
      h('p', {class: 'pack-title'}, p.title),
      h('p', {class: 'muted'}, `${p.topic ? p.topic + ' · ' : ''}${p.items.length} заданий · к повтору: ${prog.missed.length} · пройдено: ${prog.plays}`),
      h('div', {class: 'row'},
        h('button', {class: 'primary', on: {click: () => startPack(p)}}, 'Играть'),
        h('button', {on: {click: () => toggleVocab(p.id)}}, 'Словарь')
      ),
      vocabBox(p)
    );
    if(!BUILTIN_IDS.includes(p.id)) card.querySelector('.row').append(h('button', {on: {click: () => removePack(p.id)}}, 'Удалить'));
    list.append(card);
  });
}

function vocabBox(p){
  const box = h('div', {class: openVocab.has(p.id) ? '' : 'hidden', style: 'margin-top:10px'});
  const items = p.vocabulary || [];
  if(!items.length){
    box.append(h('p', {class: 'muted'}, 'В пакете нет словаря.'));
    return box;
  }
  box.append(h('ul', {class: 'vocab'}, items.map(v => h('li', null,
    h('b', null, v.word), ` — ${v.ru || ''}`,
    v.example ? h('div', {class: 'muted'}, v.example) : null
  ))));
  box.append(h('button', {class: 'small', on: {click: () => copyQuizlet(p)}}, 'Скопировать для Quizlet'));
  return box;
}

function toggleVocab(id){
  if(openVocab.has(id)) openVocab.delete(id); else openVocab.add(id);
  renderHome();
}

async function copyQuizlet(p){
  const text = (p.vocabulary || []).map(v => `${v.word} — ${v.ru || ''} — ${v.example || ''}`).join('\n');
  try{
    await navigator.clipboard.writeText(text);
    alert('Скопировано. Вставьте в Quizlet при импорте.');
  }catch(e){
    window.prompt('Скопируйте текст:', text);
  }
}

function removePack(id){
  if(!confirm('Удалить пакет и его прогресс?')) return;
  userPacks = sanitizePacks(store.get('md_packs', [])).filter(p => p.id !== id);
  store.set('md_packs', userPacks);
  progress = sanitizeProgress(store.get('md_progress', {}));
  delete progress[id];
  store.set('md_progress', progress);
  renderHome();
}

$('btnAdd').onclick = () => $('addBox').classList.toggle('hidden');
$('schema').textContent = SCHEMA;
$('btnExample').onclick = () => { $('packText').value = JSON.stringify(DEMO, null, 2); };
$('btnSave').onclick = () => {
  let raw;
  try{ raw = JSON.parse($('packText').value); }
  catch(e){ $('addErr').textContent = 'Не получилось прочитать JSON: ' + e.message; return; }
  let pack;
  try{ pack = validatePack(raw); }
  catch(e){ $('addErr').textContent = e.message; return; }
  const next = [...sanitizePacks(store.get('md_packs', [])), {
    id: 'p' + Math.random().toString(36).slice(2, 9),
    title: pack.title.trim(),
    topic: typeof pack.topic === 'string' ? pack.topic : '',
    vocabulary: Array.isArray(pack.vocabulary) ? pack.vocabulary.filter(v => v && typeof v.word === 'string') : [],
    items: pack.items
  }];
  if(!store.set('md_packs', next)){
    $('addErr').textContent = 'Не удалось сохранить пакет: браузер не даёт писать в хранилище.';
    return;
  }
  userPacks = next;
  $('packText').value = '';
  $('addErr').textContent = '';
  $('addBox').classList.add('hidden');
  renderHome();
};

// ---------- Сессия ----------

// Короткая блокировка после смены экрана: второй клик двойного тапа не должен ответить на новое задание.
function locked(){
  return S.answered || performance.now() < S.lockUntil;
}

function startPack(p){
  const missed = (progress[p.id] && progress[p.id].missed) || [];
  const order = shuffle(p.items.map((_, i) => i));
  S = {
    pack: p,
    queue: [...order.filter(i => missed.includes(i)), ...order.filter(i => !missed.includes(i))],
    done: 0, total: p.items.length, firstTry: 0,
    attempts: {}, misses: [], solved: {},
    streak: 0, best: 0, earned: 0, gained: 0, current: null, answered: false, lockUntil: 0
  };
  show('scrPlay');
  nextItem();
}

function nextItem(){
  if(!S.queue.length) return finish();
  S.current = S.queue.shift();
  S.answered = false;
  renderItem();
}

function renderItem(){
  const it = S.pack.items[S.current];
  const task = $('task');
  task.replaceChildren();
  $('fb').textContent = '';
  $('fb').className = 'fb';
  $('btnNext').classList.add('hidden');
  $('counter').textContent = `готово ${S.done} из ${S.total}`;
  $('bar').style.width = (S.done / S.total * 100) + '%';
  S.lockUntil = performance.now() + 350;
  if(it.type === 'gap') renderGap(it);
  else if(it.type === 'meaning') renderMeaning(it);
  else if(it.type === 'build') renderBuild(it);
  else renderListen(it);
  updateStats();
}

function renderGap(it){
  $('prompt').textContent = 'Вставьте подходящее слово';
  const [before, after] = it.sentence.split('___');
  $('task').append(
    h('div', {class: 'sentence'}, before, h('span', {class: 'gap'}, '_____'), after),
    ...shuffle(it.options).map(o => h('button', {class: 'opt', 'data-v': o,
      on: {click: e => pickOption(e.currentTarget, o, it.answer, it)}}, o))
  );
}

function renderMeaning(it){
  $('prompt').textContent = 'Выберите перевод';
  $('task').append(
    h('div', {class: 'sentence'}, h('b', null, it.word)),
    ...shuffle(it.options).map(o => h('button', {class: 'opt', 'data-v': o,
      on: {click: e => pickOption(e.currentTarget, o, it.answer, it)}}, o))
  );
}

function pickOption(btn, value, correct, it){
  if(locked()) return;
  const buttons = $('task').querySelectorAll('button.opt');
  buttons.forEach(b => { b.disabled = true; if(b.dataset.v === correct) b.classList.add('right'); });
  const ok = value === correct;
  if(!ok) btn.classList.add('wrong');
  judge(ok, it);
}

function renderBuild(it){
  $('prompt').textContent = 'Соберите предложение из слов';
  const words = it.sentence.trim().split(/\s+/);
  let pool = shuffle(words.map((w, i) => ({w, i})));
  let placed = [];
  const area = h('div', {class: 'answer-area'});
  const bank = h('div', {class: 'chips'});
  const checkBtn = h('button', {class: 'primary', disabled: true, on: {click: () => {
    if(locked()) return;
    const ok = placed.length === words.length && placed.every((c, k) => c.w === words[k]);
    $('task').querySelectorAll('button').forEach(b => b.disabled = true);
    judge(ok, it);
  }}}, 'Проверить');

  const chip = (c, from) => h('button', {class: 'chip small', on: {click: () => {
    if(locked()) return;
    if(from === 'placed'){ placed = placed.filter(x => x !== c); pool.push(c); }
    else { pool = pool.filter(x => x !== c); placed.push(c); }
    redraw();
  }}}, c.w);

  const redraw = () => {
    area.replaceChildren(...placed.map(c => chip(c, 'placed')));
    bank.replaceChildren(...pool.map(c => chip(c, 'pool')));
    checkBtn.disabled = placed.length !== words.length;
  };

  $('task').append(h('div', {class: 'prompt'}, 'Ваш ответ (нажмите слово, чтобы убрать):'), area,
    h('div', {class: 'prompt'}, 'Слова:'), bank, checkBtn);
  redraw();
}

function renderListen(it){
  $('prompt').textContent = 'Послушайте и напишите предложение';
  const input = h('input', {type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'Напишите услышанное'});
  const checkBtn = h('button', {class: 'primary', on: {click: () => {
    if(locked() || !norm(input.value)) return;
    const ok = norm(input.value) === norm(it.sentence);
    input.disabled = true;
    checkBtn.disabled = true;
    judge(ok, it);
  }}}, 'Проверить');
  input.addEventListener('keydown', e => { if(e.key === 'Enter') checkBtn.click(); });
  $('task').append(
    h('button', {class: 'primary', on: {click: () => speak(it.sentence)}}, '▶ Слушать'),
    h('div', {style: 'height:10px'}),
    input,
    h('div', {style: 'margin-top:8px'}, checkBtn)
  );
  if(!('speechSynthesis' in window)){
    $('task').append(h('p', {class: 'muted'}, 'Озвучка в этом браузере недоступна. Текст: ', h('b', null, it.sentence)));
  }
}

function correctText(it){
  return it.type === 'build' || it.type === 'listen' ? it.sentence : it.answer;
}

function judge(ok, it){
  S.answered = true;
  const key = S.current;
  if(ok){
    S.done++;
    if(!S.attempts[key]) S.firstTry++;
    S.solved[key] = true;
    S.streak++;
    S.best = Math.max(S.best, S.streak);
    const gain = 10 + Math.min(S.streak - 1, 4) * 2;
    S.earned += gain;
    S.gained += gain;
    feedback(true, `Верно! +$${gain}`, it);
  } else {
    S.streak = 0;
    S.attempts[key] = (S.attempts[key] || 0) + 1;
    if(!S.misses.includes(key)) S.misses.push(key);
    S.queue.push(key);
    feedback(false, 'Пока нет. Это задание вернётся позже.', it);
  }
  $('bar').style.width = (S.done / S.total * 100) + '%';
  $('btnNext').classList.remove('hidden');
  persistSession();
  updateStats();
}

function feedback(ok, msg, it){
  const extra = [];
  if(!ok) extra.push(h('div', {class: 'tip'}, 'Правильный ответ: ', h('b', null, correctText(it))));
  if(it.ru) extra.push(h('div', {class: 'tip'}, it.ru));
  if(it.tip) extra.push(h('div', {class: 'tip'}, it.tip));
  const fb = $('fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.replaceChildren(h('div', null, msg), ...extra);
}

// Сохраняет прогресс сразу после каждого ответа. Перечитывает хранилище, чтобы не затереть данные другой вкладки.
function persistSession(){
  if(!S) return;
  const stored = sanitizeProgress(store.get('md_progress', {}));
  const prev = stored[S.pack.id] || {missed: [], plays: 0, bestFirstTry: 0};
  stored[S.pack.id] = {
    ...prev,
    missed: [...new Set([...S.misses, ...prev.missed.filter(i => !S.solved[i])])]
  };
  progress = stored;
  store.set('md_progress', progress);
  capital = readCapital() + S.earned;
  store.set('md_capital', capital);
  S.earned = 0;
}

function finish(){
  const earned = S.gained;
  persistSession();
  const entry = progress[S.pack.id];
  entry.plays += 1;
  entry.bestFirstTry = Math.max(entry.bestFirstTry, S.firstTry);
  store.set('md_progress', progress);
  $('result').replaceChildren(
    h('p', {class: 'pack-title'}, S.pack.title),
    h('p', null, `С первого раза: ${S.firstTry} из ${S.total}`),
    h('p', null, `Заработано: $${earned}. Лучшая серия: ${S.best}.`),
    S.misses.length
      ? h('p', {class: 'muted'}, `Заданий с ошибкой: ${S.misses.length}. Они пойдут первыми в следующий раз.`)
      : h('p', {class: 'muted'}, 'Без ошибок.')
  );
  show('scrDone');
}

$('btnBack').onclick = () => { persistSession(); show('scrHome'); };
$('btnHome').onclick = () => show('scrHome');
$('btnAgain').onclick = () => { if(S) startPack(S.pack); };
$('btnNext').onclick = nextItem;

// Сохраняем, если вкладку убрали или закрыли посреди сессии.
document.addEventListener('visibilitychange', () => { if(document.hidden) persistSession(); });
window.addEventListener('pagehide', persistSession);

show('scrHome');
</script>
</body>
